name: One-time v109 video source formatting
on:
  push:
    branches:
      - hunters-2-compatibility
    paths:
      - .github/workflows/video109_format_once.yml
permissions:
  contents: write
jobs:
  format-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hunters-2-compatibility
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format source
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frameworks/core_animation/composition.rs src/frameworks/media_player/movie_player.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: format v109 video presentation diagnostics"
            git push origin HEAD:hunters-2-compatibility
          fi
